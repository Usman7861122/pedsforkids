# Builds the Astro site and uploads it to the S3 bucket on every push to main.
# Setup steps are in docs/deploy-s3.md.
name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub prove its identity to AWS (no long-lived keys needed)
  contents: read

concurrency:
  group: deploy-s3
  cancel-in-progress: true

env:
  S3_BUCKET: pedsforkids-website

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Debug OIDC (safe info only)
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          echo "Role secret length: ${#ROLE} (expected 56)"
          echo "Role starts with arn:aws:iam::408421298613:role/ ? $([[ "$ROLE" == arn:aws:iam::408421298613:role/pedsforkids-github-deploy ]] && echo EXACT_MATCH || echo NO_MATCH)"
          echo "Region value: [$REGION]"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import sys,base64,json
          b=sys.stdin.read().strip(); b+='='*(-len(b)%4)
          c=json.loads(base64.urlsafe_b64decode(b))
          for k in ('iss','aud','sub','repository','ref'): print(k,'=',c.get(k))
          "

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed files in /_astro can be cached for a year.
      - name: Upload assets
        run: aws s3 sync dist/ s3://$S3_BUCKET/ --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable" --exclude "images/*" --exclude "video/*" --exclude "favicon.svg"

      # Pages, images and video: always check for a fresh copy.
      - name: Upload pages and media
        run: aws s3 sync dist/ s3://$S3_BUCKET/ --delete --exclude "_astro/*" --cache-control "public,max-age=0,must-revalidate"

      - name: Clear CloudFront cache (only if you use CloudFront)
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
